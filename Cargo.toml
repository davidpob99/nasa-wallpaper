[package]
name = "nasa-wallpaper"
description = "Change your desktop background with a NASA image"
version = "2.1.3"
authors = ["David Población Criado <davidpblcrd@protonmail.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/davidpob99/nasa-wallpaper"

[dependencies]
clap = "4.6.9"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
wallpaper = { package = "wallpaper-ng", version = "0.1.2", features = ["from_url"]}
colored = "3.1.1"
jiff = "1.0.2"
serde_json = "1.0.154"
rand = "0.10.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
swash = "0.2.10"
textwrap = "0.16.2"
anyhow = "1.0.104"
tempfile = "3.23.0"

[dev-dependencies]
mockito = "1.7.2"
