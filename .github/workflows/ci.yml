name: CI

on:
  push:
    branches: [master]
    tags: ['v*', 'test-release']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CRATE_NAME: nasa-wallpaper
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: ${{ matrix.platform.os_name }} / rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: nasa-wallpaper
            name: nasa-wallpaper-Linux-x86_64-gnu.tar.gz
            skip_tests: true
          - os_name: Linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            bin: nasa-wallpaper
            name: nasa-wallpaper-Linux-aarch64-gnu.tar.gz
            skip_tests: true
          - os_name: Linux-arm
            os: ubuntu-24.04
            target: arm-unknown-linux-gnueabi
            bin: nasa-wallpaper
            name: nasa-wallpaper-Linux-arm-gnu.tar.gz
            skip_tests: true
          - os_name: Linux-i686
            os: ubuntu-24.04
            target: i686-unknown-linux-gnu
            bin: nasa-wallpaper
            name: nasa-wallpaper-Linux-i686-gnu.tar.gz
            skip_tests: true
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: nasa-wallpaper.exe
            name: nasa-wallpaper-Windows-x86_64.zip
            skip_tests: true
          - os_name: Windows-i686
            os: windows-latest
            target: i686-pc-windows-msvc
            bin: nasa-wallpaper.exe
            name: nasa-wallpaper-Windows-i686.zip
            skip_tests: true
          - os_name: Windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: nasa-wallpaper.exe
            name: nasa-wallpaper-Windows-aarch64.zip
            skip_tests: true
          - os_name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: nasa-wallpaper
            name: nasa-wallpaper-Darwin-x86_64.tar.gz
            skip_tests: true
          - os_name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: nasa-wallpaper
            name: nasa-wallpaper-Darwin-aarch64.tar.gz
            skip_tests: true
        toolchain: [stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2
        with:
          key: "v2"
      - name: Install musl tools
        if: contains(matrix.platform.name, 'musl')
        run: sudo apt-get update --yes && sudo apt-get install --yes musl-tools
      - name: Build
        uses: houseabsolute/actions-rust-cross@9a1618ffb70e8374ab5f48fcccea3ebeacf57971
        with:
          command: build
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args: "--locked --release"
          strip: true
      - name: Test
        if: ${{ !matrix.platform.skip_tests }}
        uses: houseabsolute/actions-rust-cross@9a1618ffb70e8374ab5f48fcccea3ebeacf57971
        with:
          command: test
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args: "--locked --release"
      - name: Package archive
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/test-release'
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            7z a ../../../${{ matrix.platform.name }} ${{ matrix.platform.bin }}
          else
            tar czvf ../../../${{ matrix.platform.name }} ${{ matrix.platform.bin }}
          fi
      - name: Upload artifacts
        if: github.ref == 'refs/tags/test-release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nasa-wallpaper-${{ matrix.platform.os_name }}
          path: "nasa-wallpaper-*"
      - name: Generate SHA-256
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform.os == 'macos-latest'
        run: shasum -a 256 ${{ matrix.platform.name }}
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836
        with:
          draft: true
          files: "nasa-wallpaper*"
